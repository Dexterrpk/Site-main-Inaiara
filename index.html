<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro ao carregar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
    }

    .error-page {
      width: min(560px, 90%);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      border: 3px solid #9aa0a6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #777;
      font-weight: 300;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      font-weight: 500;
    }

    p {
      margin: 0 auto 8px;
      color: #5f6368;
      font-size: 16px;
      line-height: 1.6;
      max-width: 500px;
    }

    .details {
      margin-top: 24px;
      padding: 14px 18px;
      background: #eeeeee;
      border-radius: 6px;
      color: #6b6b6b;
      font-family: monospace;
      font-size: 13px;
      text-align: left;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 11px 22px;
      border: 1px solid #dadce0;
      border-radius: 5px;
      background: white;
      color: #3c4043;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .button:hover {
      background: #f1f3f4;
    }

    .footer {
      margin-top: 34px;
      color: #9aa0a6;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="icon">!</div>

    <h1>Não foi possível carregar esta página</h1>

    <p>
      O servidor encontrou um problema inesperado ao processar esta solicitação.
    </p>

    <p>
      Tente novamente em alguns minutos.
    </p>

    <div class="details">
      ERR_CONNECTION_RESET<br>
      Código: 503
    </div>

    <a href="#" class="button" onclick="location.reload(); return false;">
      Tentar novamente
    </a>

    <div class="footer">
      A página será atualizada automaticamente.
    </div>

  </main>

  <script>
    // Tenta novamente depois de 60 segundos
    setTimeout(function () {
      location.reload();
    }, 60000);
  </script>

</body>
</html>
